name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npx --yes @biomejs/biome@2.6.2 ci .
      - run: node --test

  raycast:
    name: raycast extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: raycast/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx eslint src
      - run: npx prettier --check .

  excel:
    name: excel add-in
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: excel/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run validate
